# The board track's reusable workflow. Task REPO-6 creates it EMPTY; the
# board track fills it.
#
# A per-track unit is a reusable workflow and it contributes a JOB, not a step.
# Nothing outside a callee workflow can insert a step into it, so this track
# adds its steps inside this job, in this file, and touches `ci.yml` in zero
# places.
#
# Until the board track adds its lint step, this job exists to give that
# step a file to live in and to give the caller a resolvable `uses:`
# reference.

name: track-board

on:
  workflow_call:

permissions:
  contents: read

jobs:
  board-lints:
    name: board-lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: This track has no step yet
        run: echo "track-board is empty. BRD-20 adds the pmem-funnel-lint step."
