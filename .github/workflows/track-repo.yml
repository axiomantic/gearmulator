# The repo track's reusable workflow. Task REPO-6 creates it; the repo track
# fills it.
#
# A per-track unit is a REUSABLE WORKFLOW and it contributes a JOB, not a step.
# GitHub resolves a local reusable workflow only as `./.github/workflows/<file>`,
# and nothing outside a callee workflow can insert a step into it. Each track
# therefore declares exactly one job in its own file and adds its steps inside
# that job.
#
# This file exists in ALL SEVEN repositories, because the four artifact-boundary
# lint steps run in every one of them, and a step with no file to live in runs
# nowhere.
#
# THE FOUR STEPS CLOSE FOUR DIFFERENT HOLES AND NONE SUBSTITUTES FOR ANOTHER.
#   no-private-submodule    stops the private repository's URL and commit
#                           hashes being published.
#   no-clavia-payload       stops a Clavia byte reaching a public tree as a
#                           committed file.
#   no-clavia-upload        stops a Clavia byte LEAVING a public runner as a
#                           build artifact. That route has no committed file in
#                           it at all, so the payload step cannot see it.
#   no-artifact-credential  stops a public repository holding the credential
#                           that would let it fetch one.

name: track-repo

on:
  workflow_call:
    inputs:
      visibility:
        description: >-
          The calling repository's visibility, `public` or `private`. One clause
          of the credential lint is scoped to public repositories: a `secrets.`
          reference outside the three organization momus secrets is a defect in
          a public repository, while inside the private one the T1 and T2 jobs
          legitimately hold what they need. The other three steps apply to all
          seven repositories without exception.
        required: false
        type: string
        default: public

permissions:
  contents: read

jobs:
  repo-lints:
    name: repo-lints
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository under test
        uses: actions/checkout@v4
        with:
          path: under-test

      # The four lint scripts live in the tools repository, which is PUBLIC.
      # Reading it needs no credential of any kind.
      - name: Check out the lint scripts
        uses: actions/checkout@v4
        with:
          repository: axiomantic/nmg2-tools
          path: lint-tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: no-private-submodule
        working-directory: lint-tools
        run: python3 -m nmg2_tools.submodule_lint "${GITHUB_WORKSPACE}/under-test"

      - name: no-clavia-payload
        working-directory: lint-tools
        run: |
          python3 -m nmg2_tools.payload_lint "${GITHUB_WORKSPACE}/under-test" \
            --register nmg2_tools/testdata/register.tsv

      # The upload step reads the WHOLE workflow text and NOT an action
      # allow-list. A `run: gh release download` against the private
      # repository, a `curl` against a private release asset and a `git clone`
      # of the private repository are none of `upload-artifact`, `cache` or
      # `download-artifact`, and an action allow-list passes all three
      # untouched.
      #
      # The patterns below are assembled from split string literals ON PURPOSE.
      # This step scans EVERY workflow file in the repository, including this
      # one. A pattern written as one literal would match its own definition
      # and the step would fail on itself for ever.
      - name: no-clavia-upload
        env:
          VISIBILITY: ${{ inputs.visibility }}
        run: |
          set -uo pipefail
          pa="nmg2""-artifacts"
          pb="gold""en/"
          pc="captu""res/"
          pd="corp""us/"
          pe="fixtures/proto""col/"
          pf="[._]dum""p\b"
          patterns="${pa}|${pb}|${pc}|${pd}|${pe}|${pf}"
          # The allow-list is the set of jobs the plan places INSIDE the private
          # repository. That is exactly one workflow file, and it is allow-listed
          # only when the calling repository is the private one.
          allow=""
          if [ "${VISIBILITY}" = "private" ]; then
            allow="t1-t2.yml"
          fi
          fail=0
          for f in under-test/.github/workflows/*.yml under-test/.github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            if [ -n "${allow}" ] && [ "${base}" = "${allow}" ]; then
              echo "allow-listed: ${base}"
              continue
            fi
            if grep -nEi "${patterns}" "$f"; then
              echo "FAILURE no-clavia-upload: ${f} names the private repository or an artifact-tree path."
              fail=1
            fi
          done
          exit "${fail}"

      - name: no-artifact-credential
        working-directory: lint-tools
        run: |
          python3 -m nmg2_tools.credential_lint "${GITHUB_WORKSPACE}/under-test" \
            --visibility "${{ inputs.visibility }}"
