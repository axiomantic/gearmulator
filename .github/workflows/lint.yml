# The lint-only caller.
#
# `ci.yml` already declares a `track-repo` job, but `ci.yml` is
# `workflow_dispatch` only: its build matrix costs hours of runner time, so
# automatic triggers were removed from it. That removal took the repo-lint
# layer with it, and the artifact-boundary guards have therefore never run on
# a pull request in this repository. A guard that never runs and a guard that
# is absent produce the same observable.
#
# This file restores the automatic trigger for the CHEAP half only. It calls
# the same reusable workflow `ci.yml` calls, on one ubuntu runner, and it
# carries no build matrix and no T0 job. `ci.yml` is left exactly as it was.
#
# The `push` trigger is now scoped to the default branch, so a branch and its
# pull request are judged once, by the `pull_request` event.
#
# That event checks out the MERGE result; a `push` event checks out the head as
# it stands. The reusable workflow's checkout of the repository under test
# passes no `ref:`, so the event alone decides which tree the lints read.
#
# The cost, stated and not hidden: a branch with no open pull request is no
# longer covered. That is what the unscoped trigger bought, and it is
# deliberately given up.
#
# Why, measured 2026-09-04: two pull requests elsewhere in this queue were red
# only in the `push` context, and their head trees failed on different lint
# codes -- one reported 24 findings against its head, the other 1, and both
# reported 0 against their merge tree. The counts differ; the zero does not.

name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lints:
    uses: ./.github/workflows/track-repo.yml
    with:
      visibility: public
