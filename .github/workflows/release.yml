name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.4.0)"
        required: true

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest, macos-14, windows-2022 ]
      fail-fast: true
    name:  ${{ matrix.os }} build
    # This workflow has never run in this repository, so there is no measured
    # healthy duration for it and the ceilings below are deliberately loose.
    # It configures more plugin formats than the CMake workflow does, so its
    # nearest comparable figure -- 67 minutes to build macOS on the nightly
    # workflow -- is a floor rather than an estimate. A loose ceiling still
    # separates slow from stuck; no ceiling at all lets a stuck step hold a
    # runner for six hours.
    timeout-minutes: 180
    steps:
    - name: Install Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt update && sudo apt install -y libgl1-mesa-dev xorg-dev libasound2-dev

    - uses: actions/checkout@v4
      with:
        submodules: "recursive"

    - name: Set up MSVC compiler
      if: matrix.os == 'windows-2022'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Nim
      uses: jiro4989/setup-nim-action@v2
      with:
        # The MCF5407 core compiles its Nim sources during CMake configure and
        # stops the configure on any version other than the one its own
        # .nim-version names, so the pin here is an exact version and not a
        # range. Advance it together with that file.
        nim-version: '2.2.10'
        # The compiler tree goes outside the workspace: the default puts it in
        # the working directory, where it becomes a subtree of the checkout
        # that the build's recursive source globs would walk.
        parent-nim-install-directory: ${{ runner.temp }}
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure CMake
      run: cmake --preset github-${{ runner.os }} -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      # 120 rather than the nightly workflow's 90: that figure came from a
      # measured 67-minute macOS build of a smaller configure, and this one has
      # no measurement of its own to narrow the margin with.
      timeout-minutes: 120
      run: cmake --build --preset github-${{ runner.os }} --parallel 6

    - name: Pack
      # No CMAKE_SKIP_INSTALL_ALL_DEPENDENCY here, unlike the other two
      # workflows: the macOS preset selects the Xcode generator, which writes no
      # preinstall target for cpack to re-drive the build through, so the flag
      # would have nothing to switch off on the platform that hangs. The Linux
      # preset does take the Makefile generator and does pay for the re-run --
      # a few minutes there, not the macOS hang -- and is left for a separate
      # decision rather than changed blind on a workflow that cuts releases.
      timeout-minutes: 30
      run: cpack --preset github-${{ runner.os }}

    - name: Create Changelog
      run: ${{github.workspace}}/bin/tools/changelogGenerator -i ${{github.workspace}}/doc/changelog.txt -o ${{github.workspace}}/doc/changelog_split

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        body_path: ${{github.workspace}}/doc/changelog_split/${{ github.event.inputs.version }}.txt
        draft: true
        prerelease: false
        name: ${{ github.event.inputs.version }}
        tag_name: ${{ github.event.inputs.version }}
        files: |
          ${{github.workspace}}/build/*${{ github.event.inputs.version }}*.zip
          ${{github.workspace}}/build/*${{ github.event.inputs.version }}*.rpm
          ${{github.workspace}}/build/*${{ github.event.inputs.version }}*.deb
          ${{github.workspace}}/doc/changelog.txt
