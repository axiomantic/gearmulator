name: Release

# GITHUB-ONLY WORKFLOW. It publishes a GitHub Release, so it has no Forgejo
# counterpart at all, and its macos-14 and windows-2022 legs have no
# self-hosted host to run on either. Its build, pack and changelog steps still
# call the shared scripts so the release build cannot drift from the CI build.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.4.0)"
        required: true

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest, macos-14, windows-2022 ]
      fail-fast: true
    name:  ${{ matrix.os }} build
    env:
      CI_BUILD_TYPE: Release
      CI_PRESET: github-${{ runner.os }}
      CI_PARALLEL: 6
    steps:
    - name: Install Dependencies
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        sudo apt update && sudo apt install -y libgl1-mesa-dev xorg-dev libasound2-dev

    - uses: actions/checkout@v4
      with:
        submodules: "recursive"

    - name: Set up MSVC compiler
      if: matrix.os == 'windows-2022'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Nim
      uses: jiro4989/setup-nim-action@v2
      with:
        # mcf5407's .nim-version is the authority for this number: the core
        # compiles its Nim sources during CMake configure and stops the
        # configure on any other version. This is a second spelling of it
        # because setup-nim-action takes the version as an input and cannot
        # read a file out of a dependency; advance the two together. The
        # Forgejo legs need no literal -- scripts/ci/install-nim.sh reads that
        # file directly.
        nim-version: '2.2.10'
        # The compiler tree goes outside the workspace: the default puts it in
        # the working directory, where it becomes a subtree of the checkout
        # that the build's recursive source globs would walk.
        parent-nim-install-directory: ${{ runner.temp }}
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    # Windows keeps inline commands: see the note in cmake.yml.
    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-2022'
      run: cmake --preset github-${{ runner.os }} -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build (Windows)
      if: matrix.os == 'windows-2022'
      run: cmake --build --preset github-${{ runner.os }} --parallel 6

    - name: Pack (Windows)
      if: matrix.os == 'windows-2022'
      run: cpack --preset github-${{ runner.os }}

    - name: Create Changelog (Windows)
      if: matrix.os == 'windows-2022'
      run: ${{github.workspace}}/bin/tools/changelogGenerator -i ${{github.workspace}}/doc/changelog.txt -o ${{github.workspace}}/doc/changelog_split

    - name: Configure CMake
      if: matrix.os != 'windows-2022'
      shell: bash
      run: ./scripts/ci/configure.sh

    - name: Build
      if: matrix.os != 'windows-2022'
      shell: bash
      run: ./scripts/ci/build.sh

    - name: Pack
      if: matrix.os != 'windows-2022'
      shell: bash
      run: ./scripts/ci/pack.sh

    - name: Create Changelog
      if: matrix.os != 'windows-2022'
      shell: bash
      run: ./scripts/ci/changelog.sh

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        body_path: ${{github.workspace}}/doc/changelog_split/${{ github.event.inputs.version }}.txt
        draft: true
        prerelease: false
        name: ${{ github.event.inputs.version }}
        tag_name: ${{ github.event.inputs.version }}
        files: |
          ${{github.workspace}}/build/*${{ github.event.inputs.version }}*.zip
          ${{github.workspace}}/build/*${{ github.event.inputs.version }}*.rpm
          ${{github.workspace}}/build/*${{ github.event.inputs.version }}*.deb
          ${{github.workspace}}/doc/changelog.txt
