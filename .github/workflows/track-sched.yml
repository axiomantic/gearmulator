# The sched track's reusable workflow. Task REPO-6 creates it EMPTY; the
# sched track fills it.
#
# A per-track unit is a reusable workflow and it contributes a JOB, not a step.
# Nothing outside a callee workflow can insert a step into it, so this track
# adds its steps inside this job, in this file, and touches `ci.yml` in zero
# places.
#
# THIS JOB ASSERTS NOTHING YET AND IT SAYS SO. Until the sched track adds its
# no-system-clock step, this job exists to give that step a file to live in and
# to give the caller a resolvable `uses:` reference.

name: track-sched

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sched-lints:
    name: sched-lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: This track has no step yet
        run: echo "track-sched is empty. SCH-26 adds the no-system-clock step."
