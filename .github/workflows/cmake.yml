name: CMake

# The build logic lives in scripts/ci/*.sh, shared with
# .forgejo/workflows/cmake.yml so the two CI systems cannot drift apart. This
# file sets up a toolchain and picks a matrix leg; it does not carry build
# commands of its own except on Windows, below.
#
# GITHUB-ONLY LEGS: macos-14 and windows-2022. Private CI is a single
# Linux/Podman Forgejo runner, so there is no self-hosted host that could run
# them. They stay here and have no Forgejo counterpart.

on: [push, pull_request]

# GitHub runs every superseded push to completion unless told otherwise, so
# unlike the Forgejo half this block changes behaviour rather than restating a
# default. Keyed on the ref, so a branch's push run and the pull_request run
# for the same commit land in different groups and neither cancels the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-14, windows-2022 ]
        cmake_generator: [ default, Ninja ]
        include:
          # Windows configures the G2 alone. These branches change the G2, and a
          # Windows build of every synth does not finish inside the Build
          # ceiling, so it reports a timeout instead of a verdict on that code.
          # The other synths still build here on Linux and macOS, in upstream's
          # CI, and in nightly and release.
          - os: windows-2022
            synth_flags: >-
              -Dgearmulator_SYNTH_OSIRUS=OFF
              -Dgearmulator_SYNTH_OSTIRUS=OFF
              -Dgearmulator_SYNTH_VAVRA=OFF
              -Dgearmulator_SYNTH_XENIA=OFF
              -Dgearmulator_SYNTH_NODALRED2X=OFF
              -Dgearmulator_SYNTH_JE8086=OFF
              -Dgearmulator_SYNTH_G2=ON
      fail-fast: false
    name:  ${{ matrix.os }} build with ${{ matrix.cmake_generator }} cmake generator
    # A backstop for every step that has no ceiling of its own. The slowest
    # healthy job is macOS with Ninja at 67 minutes end to end, so 120 leaves
    # room for a slow runner while still failing the same day. Without any
    # ceiling a stuck step runs to GitHub's six-hour limit, and a run that
    # stays in progress forever never reports a conclusion at all.
    timeout-minutes: 120
    env:
      CI_BUILD_TYPE: Release
      CI_CMAKE_GENERATOR: ${{ matrix.cmake_generator == 'Ninja' && 'Ninja' || '' }}
      CI_CMAKE_ARGS: ${{ matrix.synth_flags }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: "recursive"

    - name: Install X
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: ./scripts/ci/install-linux-deps.sh

    - name: Setting up Ninja build system
      if: matrix.cmake_generator == 'Ninja'
      uses: seanmiddleditch/gha-setup-ninja@master

    - name: Set up MSVC compiler
      if: matrix.os == 'windows-2022'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Nim
      uses: jiro4989/setup-nim-action@v2
      with:
        # mcf5407's .nim-version is the authority for this number: the core
        # compiles its Nim sources during CMake configure and stops the
        # configure on any other version. This is a second spelling of it
        # because setup-nim-action takes the version as an input and cannot
        # read a file out of a dependency; advance the two together. The
        # Forgejo legs need no literal -- scripts/ci/install-nim.sh reads that
        # file directly.
        nim-version: '2.2.10'
        # The compiler tree goes outside the workspace: the default puts it in
        # the working directory, where it becomes a subtree of the checkout
        # that the build's recursive source globs would walk.
        parent-nim-install-directory: ${{ runner.temp }}
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    # Windows keeps inline commands. The shared scripts are bash, and Git Bash
    # on a Windows runner hands CMake MSYS-style paths that the MSVC generator
    # does not read back the way it wrote them. Nothing about that is worth
    # discovering in a build that takes an hour to fail.
    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-2022'
      run: cmake ${{ matrix.cmake_generator != 'default' && format('-G {0}', matrix.cmake_generator) || '' }} -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_SKIP_INSTALL_ALL_DEPENDENCY=ON ${{ matrix.synth_flags }}

    - name: Build (Windows)
      if: matrix.os == 'windows-2022'
      timeout-minutes: 90
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel 3

    - name: Pack (Windows)
      if: matrix.os == 'windows-2022'
      timeout-minutes: 20
      working-directory: ${{github.workspace}}/build
      run: cmake -P ${{github.workspace}}/scripts/pack.cmake

    - name: Configure CMake
      if: matrix.os != 'windows-2022'
      shell: bash
      run: ./scripts/ci/configure.sh

    - name: Build
      if: matrix.os != 'windows-2022'
      # The ceiling follows the slowest healthy build, macOS with every synth,
      # plus the margin a shared runner can plausibly need. The ceiling catches
      # a build that has stopped making progress rather than one that is merely
      # slow.
      timeout-minutes: 90
      shell: bash
      env:
        # A GitHub-hosted runner reports more cores than it can keep busy on
        # this build. Three is what this matrix has always used.
        CI_PARALLEL: 3
      run: ./scripts/ci/build.sh

    - name: Pack
      if: matrix.os != 'windows-2022'
      # Healthy packing runs between 1 and 4 minutes on every generator. 20 is
      # far above that on purpose: the value only has to separate slow from
      # stuck, and a wide margin keeps a busy runner from turning into a false
      # failure here.
      timeout-minutes: 20
      shell: bash
      run: ./scripts/ci/pack.sh
