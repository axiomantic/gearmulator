name: CMake

# The Linux half of .github/workflows/cmake.yml, running on the self-hosted
# Forgejo runner. Both files call the same scripts under scripts/ci, so the
# build logic has one home and this file only sets up a toolchain and picks a
# matrix leg.
#
# The macOS and Windows legs are not here and are not coming: private CI is a
# single Linux/Podman runner, so there is no host that could run them. They stay
# in .github/workflows/cmake.yml.

on: [push, pull_request]

# Forgejo already cancels a superseded push or pull_request run of the same
# workflow on the same branch, so this block states that default rather than
# creating it. It is written out because the GitHub half needs the same
# behaviour declared explicitly and the two files are read side by side; an
# unstated default reads as an oversight.
#
# It supersedes within one ref only. Pushing the whole band stack queues a run
# per branch, and those are different refs, so this does not thin them out.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ubuntu build with ${{ matrix.cmake_generator }} cmake generator
    runs-on: docker
    # ubuntu:24.04 is what `ubuntu-latest` resolves to on the GitHub legs.
    # Naming the same distribution is what makes a failure here and a failure
    # there the same failure; a different image turns every disagreement
    # between the two legs into a toolchain question first. Nim goes on top, at
    # the version scripts/ci pins.
    container:
      image: ubuntu:24.04
    strategy:
      matrix:
        cmake_generator: [ default, Ninja ]
      fail-fast: false
    # A backstop for every step that has no ceiling of its own. Without any
    # ceiling a stuck step runs until the runner gives up, and a run that stays
    # in progress forever never reports a conclusion at all.
    timeout-minutes: 120
    env:
      CI_BUILD_TYPE: Release
      # Not left to default. lib.sh falls back to the host's core count, and on
      # a shared runner that is every core on the box; a JUCE translation unit
      # wants roughly a gigabyte while it compiles, so an uncapped build is one
      # busy neighbour away from being killed for memory. The GitHub legs use
      # the same cap. Raise it when the runner is known to be alone on its
      # hardware.
      CI_PARALLEL: 3
      CI_CMAKE_GENERATOR: ${{ matrix.cmake_generator == 'Ninja' && 'Ninja' || '' }}
      # The G2 alone. These branches change G2 code, and a build of every synth
      # does not finish inside this runner's job ceiling -- it reports a timeout
      # instead of a verdict on that code. The other synths still build on the
      # GitHub legs, in upstream's CI, and in nightly and release, so nothing
      # loses coverage by being switched off here.
      #
      # Same mechanism as the Windows narrowing in .github/workflows/cmake.yml:
      # the flags reach scripts/ci/configure.sh through CI_CMAKE_ARGS. There the
      # value comes from a matrix include, because one leg of three narrows;
      # here every leg narrows, so it is set on the job.
      CI_CMAKE_ARGS: >-
        -Dgearmulator_SYNTH_OSIRUS=OFF
        -Dgearmulator_SYNTH_OSTIRUS=OFF
        -Dgearmulator_SYNTH_VAVRA=OFF
        -Dgearmulator_SYNTH_XENIA=OFF
        -Dgearmulator_SYNTH_NODALRED2X=OFF
        -Dgearmulator_SYNTH_JE8086=OFF
        -Dgearmulator_SYNTH_G2=ON
    steps:
      # A bare distribution image has no git, and the checkout below is git.
      - name: Bootstrap git
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates

      - name: Check out the repository
        run: |
          set -eux
          git init -q .
          git remote add origin \
            "https://${{ github.actor }}:${{ github.token }}@git.axiomantic.dev/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1

      - name: Install build dependencies
        run: ./scripts/ci/install-linux-deps.sh

      - name: Install the pinned Nim toolchain
        run: echo "$(./scripts/ci/install-nim.sh | tail -1)" >> "$GITHUB_PATH"

      - name: Configure CMake
        run: ./scripts/ci/configure.sh

      - name: Build
        timeout-minutes: 90
        run: ./scripts/ci/build.sh

      - name: Pack
        timeout-minutes: 20
        run: ./scripts/ci/pack.sh
