name: CMake

# The Linux half of .github/workflows/cmake.yml, running on the self-hosted
# Forgejo runner. Both files call the same scripts under scripts/ci, so the
# build logic has one home and this file only sets up a toolchain and picks a
# matrix leg.
#
# The macOS and Windows legs are not here and are not coming: private CI is a
# single Linux/Podman runner, so there is no host that could run them. They stay
# in .github/workflows/cmake.yml.

on: [push, pull_request]

# Forgejo already cancels a superseded push or pull_request run of the same
# workflow on the same branch, so this block states that default rather than
# creating it. It is written out because the GitHub half needs the same
# behaviour declared explicitly and the two files are read side by side; an
# unstated default reads as an oversight.
#
# It supersedes within one ref only. Pushing the whole band stack queues a run
# per branch, and those are different refs, so this does not thin them out.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ubuntu build with ${{ matrix.cmake_generator }} cmake generator
    runs-on: docker
    # ubuntu:24.04 is what `ubuntu-latest` resolves to on the GitHub legs.
    # Naming the same distribution is what makes a failure here and a failure
    # there the same failure; a different image turns every disagreement
    # between the two legs into a toolchain question first. Nim goes on top, at
    # the version scripts/ci pins.
    container:
      image: ubuntu:24.04
    strategy:
      matrix:
        cmake_generator: [ default, Ninja ]
      fail-fast: false
    # A backstop for every step that has no ceiling of its own. Without any
    # ceiling a stuck step runs until the runner gives up, and a run that stays
    # in progress forever never reports a conclusion at all.
    timeout-minutes: 120
    env:
      CI_BUILD_TYPE: Release
      # Not left to default. lib.sh falls back to the host's core count, and on
      # a shared runner that is every core on the box; a JUCE translation unit
      # wants roughly a gigabyte while it compiles, so an uncapped build is one
      # busy neighbour away from being killed for memory. The GitHub legs use
      # the same cap. Raise it when the runner is known to be alone on its
      # hardware.
      CI_PARALLEL: 3
      CI_CMAKE_GENERATOR: ${{ matrix.cmake_generator == 'Ninja' && 'Ninja' || '' }}
      # The G2 alone. These branches change G2 code, and a build of every synth
      # does not finish inside this runner's job ceiling -- it reports a timeout
      # instead of a verdict on that code. The other synths still build on the
      # GitHub legs, in upstream's CI, and in nightly and release, so nothing
      # loses coverage by being switched off here.
      #
      # Same mechanism as the Windows narrowing in .github/workflows/cmake.yml:
      # the flags reach scripts/ci/configure.sh through CI_CMAKE_ARGS. There the
      # value comes from a matrix include, because one leg of three narrows;
      # here every leg narrows, so it is set on the job.
      CI_CMAKE_ARGS: >-
        -Dgearmulator_SYNTH_OSIRUS=OFF
        -Dgearmulator_SYNTH_OSTIRUS=OFF
        -Dgearmulator_SYNTH_VAVRA=OFF
        -Dgearmulator_SYNTH_XENIA=OFF
        -Dgearmulator_SYNTH_NODALRED2X=OFF
        -Dgearmulator_SYNTH_JE8086=OFF
        -Dgearmulator_SYNTH_G2=ON
    steps:
      # A bare distribution image has no git, and the checkout below is git.
      - name: Bootstrap git
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates

      - name: Check out the repository
        env:
          # Read-only, and scoped to the submodule repositories. The per-job
          # token below reaches this repository alone, so the submodule clones
          # need a credential of their own.
          SUBMODULE_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN }}
        run: |
          set -eux
          git init -q .
          git remote add origin \
            "https://${{ github.actor }}:${{ github.token }}@git.axiomantic.dev/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
          # The private forks refuse the job token, so the submodule clones
          # need the read-only one. A credential helper is the mechanism
          # rather than a URL rewrite or an extraheader because it is the only
          # one that never puts the secret in a URL or on a command line: the
          # helper body stores the variable's NAME, so `set -x`, a config dump
          # and a failing clone's error text all show `$SUBMODULE_READ_TOKEN`
          # and not its value. Scoped to this host, so the public GitHub
          # submodules never see it.
          git config --global credential."https://git.axiomantic.dev".helper \
            '!f() { test "$1" = get || return 0; printf "username=x-access-token\npassword=%s\n" "$SUBMODULE_READ_TOKEN"; }; f'
          # The relative submodule URLs resolve against this remote, and git
          # consults no credential helper for a URL that already names a
          # password. Dropping the job token from the remote now that the
          # fetch is done is what lets the helper answer for the submodules.
          git remote set-url origin \
            "https://git.axiomantic.dev/${{ github.repository }}.git"
          git submodule update --init --recursive --depth 1

      - name: Install build dependencies
        run: ./scripts/ci/install-linux-deps.sh

      - name: Install the pinned Nim toolchain
        # The script's status is captured rather than piped into echo, which
        # discards it, and pipefail is named rather than assumed of the runner:
        # a failing install otherwise exports a garbage PATH from a green step.
        run: |
          set -euo pipefail
          nimbin=$(./scripts/ci/install-nim.sh | tail -1)
          test -x "${nimbin}/nim" || { echo "install-nim.sh produced '${nimbin}', not a Nim bin directory" >&2; exit 1; }
          echo "${nimbin}" >> "$GITHUB_PATH"

      - name: Configure CMake
        run: ./scripts/ci/configure.sh

      - name: Build
        timeout-minutes: 90
        run: ./scripts/ci/build.sh

      # No environment of its own. scripts/ci/lib.sh holds the build directory
      # and the excluded labels, and the configure and build steps above read
      # the same file, so the tree this runs against cannot differ from the tree
      # that was built.
      - name: Run the test suite
        run: ./scripts/ci/test.sh

      # A compiler launcher that is wired up but never hits is indistinguishable
      # from one that is not wired up at all, and the difference is only visible
      # in the hit count and in whether CCACHE_DIR points at storage that
      # outlives the job. Both go in the log.
      - name: Compiler cache statistics
        if: always()
        run: |
          echo "CCACHE_DIR=${CCACHE_DIR:-<unset>}"
          command -v ccache >/dev/null 2>&1 && ccache -s || echo "ccache not on PATH"

      # There is no Pack step here, and its absence is deliberate.
      # scripts/ci/pack.sh runs scripts/pack.cmake, which on Linux packs ZIP,
      # DEB and RPM and raises FATAL_ERROR on the first cpack that returns
      # non-zero. This job's container is a bare ubuntu:24.04 with no rpmbuild,
      # so the RPM generator fails and takes the whole job down with it: the
      # build above then reports no verdict at all.
      #
      # It cannot be narrowed to ZIP and DEB from here: the generator list is in
      # scripts/pack.cmake, and scripts/Jenkinsfile, .github/workflows/nightly.yml
      # and scripts/example.bat read that same file, so making a generator
      # conditional there would let a release host that lost rpmbuild produce no
      # .rpm and still report success. Dropping ZIP and DEB coverage on this
      # runner is the accepted cost. The legs in .github/workflows/cmake.yml
      # still pack.

  # A job of its own rather than a step in the matrix above. The matrix runs two
  # generators, so a step there would instrument the same tree twice for one
  # verdict, and it would extend two builds that already carry their own
  # ceiling. A separate job pays for that with a duplicated bootstrap -- an
  # Actions workflow has no way to share steps between jobs -- and with one more
  # entry in the queue of a runner that serves one job at a time.
  sanitizers:
    name: address and undefined sanitizers
    # Push only. Every branch here has an open pull request, so the workflow
    # fires twice for the same commit, and an instrumented build can hold the
    # single runner for hours. The pull_request run would test the commit the
    # push run already tested.
    if: github.event_name == 'push'
    runs-on: docker
    container:
      image: ubuntu:24.04
    timeout-minutes: 240
    env:
      # One compile at a time. The container is capped at a single CPU, so
      # parallelism here buys no throughput at all; what it does buy is a
      # multiple of the peak memory, and an instrumented compile of a JUCE
      # translation unit wants roughly twice what an ordinary one does. The
      # build job above can afford 3 because its compiles are not instrumented.
      CI_PARALLEL: 1
      # The same narrowing the build job applies. A sanitizer run over a
      # different set of synths would report on a tree no other leg builds.
      CI_CMAKE_ARGS: >-
        -Dgearmulator_SYNTH_OSIRUS=OFF
        -Dgearmulator_SYNTH_OSTIRUS=OFF
        -Dgearmulator_SYNTH_VAVRA=OFF
        -Dgearmulator_SYNTH_XENIA=OFF
        -Dgearmulator_SYNTH_NODALRED2X=OFF
        -Dgearmulator_SYNTH_JE8086=OFF
        -Dgearmulator_SYNTH_G2=ON
    steps:
      - name: Bootstrap git
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates

      - name: Check out the repository
        env:
          SUBMODULE_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN }}
        run: |
          set -eux
          git init -q .
          git remote add origin \
            "https://${{ github.actor }}:${{ github.token }}@git.axiomantic.dev/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
          git config --global credential."https://git.axiomantic.dev".helper \
            '!f() { test "$1" = get || return 0; printf "username=x-access-token\npassword=%s\n" "$SUBMODULE_READ_TOKEN"; }; f'
          git remote set-url origin \
            "https://git.axiomantic.dev/${{ github.repository }}.git"
          git submodule update --init --recursive --depth 1

      - name: Install build dependencies
        run: ./scripts/ci/install-linux-deps.sh

      # The MCF5307 core compiles its Nim sources during CMake configure, so
      # this job stops at configure without the pinned toolchain and never
      # reaches the sanitizers at all.
      - name: Install the pinned Nim toolchain
        # The script's status is captured rather than piped into echo, which
        # discards it, and pipefail is named rather than assumed of the runner:
        # a failing install otherwise exports a garbage PATH from a green step.
        run: |
          set -euo pipefail
          nimbin=$(./scripts/ci/install-nim.sh | tail -1)
          test -x "${nimbin}/nim" || { echo "install-nim.sh produced '${nimbin}', not a Nim bin directory" >&2; exit 1; }
          echo "${nimbin}" >> "$GITHUB_PATH"

      - name: Build and test under the address and undefined sanitizers
        run: ./scripts/ci/sanitizer-build-and-test.sh
