name: Nightly

# The Linux half of .github/workflows/nightly.yml. Same scripts, same schedule.
# The macOS and Windows legs stay on GitHub: private CI is a single
# Linux/Podman runner.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    name: ubuntu build
    runs-on: docker
    # See the note on the image in cmake.yml.
    container:
      image: ubuntu:24.04
    timeout-minutes: 120
    env:
      CI_BUILD_TYPE: Release
      # Not left to default. lib.sh falls back to the host's core count, and on
      # a shared runner that is every core on the box; a JUCE translation unit
      # wants roughly a gigabyte while it compiles, so an uncapped build is one
      # busy neighbour away from being killed for memory. The GitHub legs use
      # the same cap. Raise it when the runner is known to be alone on its
      # hardware.
      CI_PARALLEL: 3
    steps:
      # A bare distribution image has no git, and the checkout below is git.
      - name: Bootstrap git
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates

      - name: Check out the repository
        env:
          # Read-only, and scoped to the submodule repositories. The per-job
          # token below reaches this repository alone, so the submodule clones
          # need a credential of their own.
          SUBMODULE_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN }}
        run: |
          set -eux
          git init -q .
          git remote add origin \
            "https://${{ github.actor }}:${{ github.token }}@git.axiomantic.dev/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
          # The private forks refuse the job token, so the submodule clones
          # need the read-only one. A credential helper is the mechanism
          # rather than a URL rewrite or an extraheader because it is the only
          # one that never puts the secret in a URL or on a command line: the
          # helper body stores the variable's NAME, so `set -x`, a config dump
          # and a failing clone's error text all show `$SUBMODULE_READ_TOKEN`
          # and not its value. Scoped to this host, so the public GitHub
          # submodules never see it.
          git config --global credential."https://git.axiomantic.dev".helper \
            '!f() { test "$1" = get || return 0; printf "username=x-access-token\npassword=%s\n" "$SUBMODULE_READ_TOKEN"; }; f'
          # The relative submodule URLs resolve against this remote, and git
          # consults no credential helper for a URL that already names a
          # password. Dropping the job token from the remote now that the
          # fetch is done is what lets the helper answer for the submodules.
          git remote set-url origin \
            "https://git.axiomantic.dev/${{ github.repository }}.git"
          git submodule update --init --recursive --depth 1

      - name: Install build dependencies
        run: ./scripts/ci/install-linux-deps.sh

      - name: Install the pinned Nim toolchain
        run: echo "$(./scripts/ci/install-nim.sh | tail -1)" >> "$GITHUB_PATH"

      - name: Configure CMake
        run: ./scripts/ci/configure.sh

      - name: Build
        timeout-minutes: 90
        run: ./scripts/ci/build.sh

      # There is no Pack step here, and its absence is deliberate.
      # scripts/ci/pack.sh runs scripts/pack.cmake, which on Linux packs ZIP,
      # DEB and RPM and raises FATAL_ERROR on the first cpack that returns
      # non-zero. This job's container is a bare ubuntu:24.04 with no rpmbuild,
      # so the RPM generator fails and takes the whole job down with it: the
      # build above then reports no verdict at all.
      #
      # It cannot be narrowed to ZIP and DEB from here: the generator list is in
      # scripts/pack.cmake, and scripts/Jenkinsfile, .github/workflows/nightly.yml
      # and scripts/example.bat read that same file, so making a generator
      # conditional there would let a release host that lost rpmbuild produce no
      # .rpm and still report success. Dropping ZIP and DEB coverage on this
      # runner is the accepted cost. The legs in .github/workflows/nightly.yml
      # still pack.
