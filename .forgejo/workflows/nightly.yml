name: Nightly

# The Linux half of .github/workflows/nightly.yml. Same scripts, same schedule.
# The macOS and Windows legs stay on GitHub: private CI is a single
# Linux/Podman runner.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    name: ubuntu build
    runs-on: docker
    # See the note on the image in cmake.yml.
    container:
      image: ubuntu:24.04
    timeout-minutes: 120
    env:
      CI_BUILD_TYPE: Release
      # Not left to default. lib.sh falls back to the host's core count, and on
      # a shared runner that is every core on the box; a JUCE translation unit
      # wants roughly a gigabyte while it compiles, so an uncapped build is one
      # busy neighbour away from being killed for memory. The GitHub legs use
      # the same cap. Raise it when the runner is known to be alone on its
      # hardware.
      CI_PARALLEL: 3
    steps:
      # A bare distribution image has no git, and the checkout below is git.
      - name: Bootstrap git
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates

      - name: Check out the repository
        run: |
          set -eux
          git init -q .
          git remote add origin \
            "https://${{ github.actor }}:${{ github.token }}@git.axiomantic.dev/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1

      - name: Install build dependencies
        run: ./scripts/ci/install-linux-deps.sh

      - name: Install the pinned Nim toolchain
        run: echo "$(./scripts/ci/install-nim.sh | tail -1)" >> "$GITHUB_PATH"

      - name: Configure CMake
        run: ./scripts/ci/configure.sh

      - name: Build
        timeout-minutes: 90
        run: ./scripts/ci/build.sh

      - name: Pack
        timeout-minutes: 20
        run: ./scripts/ci/pack.sh
